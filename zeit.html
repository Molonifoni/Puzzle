  <h1>Nachhall</h1>
  <p>Die Uhr im Wetterturm läuft rückwärts, seit jemand ihr Glas zerschlagen hat.</p>
  <p class="t-2"><span class="t-7">IN MIR SIEHST DU NIE MICH SELBST, NUR DICH, SEITENVERKEHRT</span></p>
  <p>Niemand hat sie repariert. Vielleicht, weil sie noch etwas zeigt.</p>
