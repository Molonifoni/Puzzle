<title>Rückkehr</title>

<body>
<main class="sheet">
  <span class="c3"></span><span class="c4"></span>
  <h1>Rückkehr</h1>
  <p class="t-2">
    Ich antworte, ohne je selbst etwas zu sagen.<br>
    Ich wiederhole genau das, was du mir gibst — nie mehr, nie weniger.<br>
    Ruf mich in einem leeren Raum, und du hörst dich selbst, etwas später.
  </p>
  <p>Der Turm hat keine Stimme. Und doch antwortet er jedes Mal.</p>
</main>
</body>
