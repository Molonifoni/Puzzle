<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übertragung II</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="sheet">
  <span class="corner-bl"></span><span class="corner-br"></span>
  <p class="tag">Übertragung II von IV</p>
  <div class="progress"><span class="done"></span><span class="done"></span><span></span><span></span></div>
  <h1>Zweite Übertragung</h1>
  <p>Diese Nachricht kam seitenverkehrt an — als hätte der Absender sie an etwas gehalten, das ihm seine eigenen Worte zurückwirft.</p>
  <div class="transmission">
    <span class="mirror">DAS LÖSUNGSWORT IST SPIEGEL</span>
  </div>
  <p class="muted">Manche Dinge muss man drehen, nicht übersetzen, um sie zu lesen.</p>

  <form class="answer" id="form2" autocomplete="off">
    <input type="text" id="answer2" placeholder="Lösungswort" aria-label="Lösungswort für Übertragung II">
    <button type="submit">Bestätigen</button>
  </form>
  <p class="status" id="status2"></p>

  <p><a class="quiet" href="kapitel1.html">&larr; erste Übertragung</a></p>
</main>

<script>
async function sha256(text) {
  const enc = new TextEncoder().encode(text.trim().toLowerCase());
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

const CORRECT_HASH = 'cb3ae634eb203d73e890f95632b6abc8359312ad87e94860e18d9aa2fd09dfe3';
const NEXT_PAGE = 'kapitel3.html';

document.getElementById('form2').addEventListener('submit', async (e) => {
  e.preventDefault();
  const status = document.getElementById('status2');
  const value = document.getElementById('answer2').value;
  if (!value.trim()) return;
  const hash = await sha256(value);
  if (hash === CORRECT_HASH) {
    status.textContent = 'Bestätigt. Die dritte Übertragung öffnet sich …';
    status.className = 'status ok';
    setTimeout(() => { window.location.href = NEXT_PAGE; }, 900);
  } else {
    status.textContent = 'Kein Treffer. Das Signal bleibt verschlossen.';
    status.className = 'status err';
  }
});
</script>
</body>
</html>
